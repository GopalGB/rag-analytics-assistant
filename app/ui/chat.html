<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Analytics Assistant</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1f2430;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #6ea8fe;
        --border: #2a2f3a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
      header .dot { width: 8px; height: 8px; border-radius: 50%; background: #36d399; }
      header .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
      #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 880px; width: 100%; margin: 0 auto; }
      .msg { margin: 0 0 16px; display: flex; flex-direction: column; }
      .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
      .bubble { padding: 12px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
      .user .bubble { background: var(--panel-2); align-self: flex-end; max-width: 80%; }
      .bot .bubble { background: var(--panel); border: 1px solid var(--border); }
      details { margin-top: 8px; font-size: 13px; color: var(--muted); }
      details summary { cursor: pointer; user-select: none; }
      pre { background: #0b0d11; border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; }
      table { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
      th, td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
      th { background: var(--panel-2); }
      form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); max-width: 880px; width: 100%; margin: 0 auto; }
      input {
        flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
        background: var(--panel); color: var(--text); font-size: 14px;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button {
        padding: 12px 18px; border-radius: 10px; border: none; background: var(--accent);
        color: #0b0d11; font-weight: 600; cursor: pointer; font-size: 14px;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .refused .bubble { border-color: #d3756b; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <h1>RAG Analytics Assistant</h1>
      <span class="meta" id="meta">connecting…</span>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="q" placeholder="Ask a question about your data…" autocomplete="off" autofocus />
      <button id="send" type="submit">Ask</button>
    </form>

    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("q");
      const send = document.getElementById("send");
      const meta = document.getElementById("meta");

      const sessionId =
        localStorage.getItem("session_id") ||
        (() => {
          const id = "s-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem("session_id", id);
          return id;
        })();

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function addMessage(who, role, text) {
        const wrap = el("div", "msg " + role);
        wrap.appendChild(el("div", "who", who));
        const bubble = el("div", "bubble", text);
        wrap.appendChild(bubble);
        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
        return wrap;
      }

      function addDetails(wrap, payload) {
        if (payload.sql) {
          const d = el("details");
          d.appendChild(el("summary", null, "SQL"));
          d.appendChild(el("pre", null, payload.sql));
          wrap.appendChild(d);
        }
        if (payload.rows && payload.rows.length) {
          const d = el("details");
          d.appendChild(el("summary", null, `Rows (${payload.row_count})`));
          const table = el("table");
          const cols = payload.columns || Object.keys(payload.rows[0]);
          const thead = el("tr");
          cols.forEach((c) => thead.appendChild(el("th", null, c)));
          table.appendChild(thead);
          payload.rows.slice(0, 20).forEach((r) => {
            const tr = el("tr");
            cols.forEach((c) => tr.appendChild(el("td", null, String(r[c] ?? ""))));
            table.appendChild(tr);
          });
          d.appendChild(table);
          wrap.appendChild(d);
        }
        if (payload.sources && payload.sources.length) {
          const d = el("details");
          d.appendChild(el("summary", null, `Sources (${payload.sources.length})`));
          payload.sources.forEach((s) =>
            d.appendChild(el("div", null, `• ${s.file} #${s.chunk_id} (${s.score})`)),
          );
          wrap.appendChild(d);
        }
      }

      async function refreshHealth() {
        try {
          const r = await fetch("/health");
          const h = await r.json();
          meta.textContent = `${h.llm_enabled ? "LLM ready" : "no LLM — set a provider"} · ${h.tables.length} tables · ${h.doc_chunks} chunks`;
        } catch {
          meta.textContent = "server unreachable";
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;
        input.value = "";
        send.disabled = true;
        addMessage("you", "user", question);
        const thinking = addMessage("assistant", "bot", "…");
        try {
          const r = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, session_id: sessionId }),
          });
          const payload = await r.json();
          thinking.remove();
          const role = payload.route === "refused" ? "bot refused" : "bot";
          const wrap = addMessage("assistant", role, payload.text || "(no answer)");
          addDetails(wrap, payload);
        } catch (err) {
          thinking.remove();
          addMessage("assistant", "bot", "Something went wrong. Please try again.");
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      refreshHealth();
    </script>
  </body>
</html>
