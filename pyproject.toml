[project]
name = "rag-analytics-assistant"
version = "0.1.0"
description = "An LLM-first, guardrailed question-answering assistant over your own tabular data and documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Optional provider extras. Core install stays light; add what you use:
#   pip install boto3            # for the AWS Bedrock provider
[project.optional-dependencies]
bedrock = ["boto3>=1.34"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
