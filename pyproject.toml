[project]
name = "private-ai-assistant"
version = "0.3.0"
description = "Local-first private AI assistant prototype: document Q&A with sources, invoice extraction, read-only QuickBooks reconciliation, approvals and audit log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Same as requirements.txt (kept in sync by tests/test_ops.py); hosts that install from pyproject need it.
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "duckdb>=1.0,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "requests>=2.31,<3.0",
    "pypdf>=4.0,<7.0",
    "pillow>=10.1,<13.0",
    "openpyxl>=3.1,<4.0",
]

# Optional extras. Core install stays light; add what you use:
#   pip install boto3            # AWS Bedrock provider (cloud; requires ALLOW_CLOUD_AI)
#   pip install keyring          # store QuickBooks tokens in the macOS Keychain
[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
keychain = ["keyring>=24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
