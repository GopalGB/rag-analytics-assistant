name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Proxy worker tests and UI syntax check
        run: |
          node --test tests/*.mjs
          node --check app/ui/app.js
          node --check app/ui/charts.js
      - name: Acceptance checks
        run: python scripts/evaluate.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - name: Scan for committed credentials (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.ollama.yml config -q
      - name: Build image
        run: docker build -t private-ai-assistant:ci .
      - name: Start container and wait until ready
        run: |
          docker run -d --name assistant -p 127.0.0.1:8000:8000 \
            -v "$PWD/data/sample:/data" -e LLM_PROVIDER=none private-ai-assistant:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 3
          done
          docker logs assistant
          exit 1
      - name: Smoke-test the API
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/dashboard > /dev/null
          curl -fsS http://127.0.0.1:8000/metrics | grep assistant_http_requests_total
