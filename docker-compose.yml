# docker compose up -d        → the assistant on http://127.0.0.1:8000 (bound to this machine only),
#                                using Ollama running natively on the host (Mac Studio: Metal GPU)
# docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#                              → also run Ollama in a container and point the assistant at it
#                                (Linux servers; same as `make docker-up-ollama`)
services:
  assistant:
    build: .
    image: private-ai-assistant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # never exposed beyond this machine unless you change it (and set APP_API_KEY)
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      TRUST_LOOPBACK: "false"   # inside Docker every request looks non-local; set APP_API_KEY in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # /data is a writable volume owned by the container user (uploads land in /data/uploads);
      # your documents are mounted read-only inside it. Replace ./data/sample when approved.
      - assistant-data:/data
      - ./data/sample:/data/library:ro
      - assistant-storage:/storage     # database, reviews, approvals, activity log, tokens
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  assistant-data:
  assistant-storage:
